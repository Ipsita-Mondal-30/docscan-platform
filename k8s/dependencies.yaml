# Demo-only MySQL + Redis for the kind cluster. On AWS these come from RDS / ElastiCache (terraform/).
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mysql, namespace: docscan}
spec:
  serviceName: mysql
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - {name: MYSQL_ROOT_PASSWORD, value: rootpw}
            - {name: MYSQL_DATABASE, value: docscan}
            - {name: MYSQL_USER, value: docscan}
            - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: docscan, key: mysql-password}}}
          ports: [{containerPort: 3306}]
          readinessProbe: {exec: {command: [mysqladmin, ping, -h, localhost, -uroot, -prootpw]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: docscan}
spec: {selector: {app: mysql}, ports: [{port: 3306}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: docscan}
spec:
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - {name: redis, image: "redis:7-alpine", ports: [{containerPort: 6379}]}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: docscan}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: mysql-backup, namespace: docscan}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: mysql:8.4
              command: ["/bin/sh", "-c", "mysqldump -h mysql -udocscan -p$MYSQL_PWD --single-transaction docscan | gzip > /backup/docscan-$(date +%F).sql.gz"]
              env: [{name: MYSQL_PWD, valueFrom: {secretKeyRef: {name: docscan, key: mysql-password}}}]
              volumeMounts: [{name: backup, mountPath: /backup}]
          volumes: [{name: backup, emptyDir: {}}]
