apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: docscan, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/Ipsita-Mondal-30/docscan-platform.git
    targetRevision: main
    path: helm/docscan
  destination: {server: "https://kubernetes.default.svc", namespace: docscan}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
