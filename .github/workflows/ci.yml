name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/docscan && helm template docscan helm/docscan >/dev/null
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
  image:
    needs: [test, iac]
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., load: true, tags: "docscan:${{ github.sha }}"}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "docscan:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "${{ env.IMAGE }}:${{ github.sha }}"}
      # GitOps: CI only bumps the image tag in git; Argo CD does the deploy.
      - if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|^  tag:.*|  tag: \"${GITHUB_SHA}\"|" helm/docscan/values.yaml
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "ci: deploy ${GITHUB_SHA::7}" && git push
